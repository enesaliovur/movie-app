name: boby_ai_case
description: "boby.ai case"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.10.1

dependencies:
  dartz: ^0.10.1
  dio: ^5.9.0
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  flutter_screenutil: ^5.9.3
  matrix4_transform: ^4.0.1
  mobx: ^2.5.0
  flutter_mobx: ^2.2.1+1
  shared_preferences: ^2.5.4
  get_it: ^9.2.0
  sembast: ^3.8.6
  rxdart: ^0.28.0
  provider: ^6.1.5+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fluttertoast: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  mobx_codegen: ^2.7.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/app_icon_dev.png
    - assets/app_icon_staging.png
    - assets/app_icon_prod.png
    - assets/fonts/
    - assets/paywall/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter_18pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_18pt-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter_18pt-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Inter_18pt-Thin.ttf
          weight: 100
